<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>FAKTOTUM Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --bg-soft: #f8f9fa;
      --text-primary: #1a0b2e;
      --text-secondary: #4a3a5c;
      --text-muted: #6b5b7d;
      --border: #e5e1eb;
      --accent-lime: #abfa0f;
      --accent-lime-soft: #f5ffe0;
      --accent-lime-glow: rgba(171, 250, 15, 0.35);
      --accent-lime-dark: #8cc408;
      --accent-purple: #764ba2;
      --accent-blue: #667eea;
      --font-heading: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; }
    body {
      background:
        radial-gradient(circle at 50% 30%, var(--accent-lime-soft) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 80%, #EDE4F7 0%, transparent 60%),
        var(--bg);
      color: var(--text-primary);
      font-family: var(--font-body);
      display: grid;
      place-items: center;
      position: relative;
    }
    /* Floating particles (lime) */
    .particles { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
    .p {
      position: absolute;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent-lime);
      opacity: 0;
      box-shadow: 0 0 12px var(--accent-lime-glow);
    }
    /* Big bolt behind everything (glow) */
    .bolt-bg {
      position: absolute;
      width: 900px; height: auto;
      top: 50%; left: 50%;
      transform: translate(-50%, -52%) scale(0.6);
      opacity: 0;
      pointer-events: none;
      filter: blur(0.5px) drop-shadow(0 0 60px var(--accent-lime-glow));
    }
    .bolt-bg path { fill: var(--accent-lime); }
    /* Main stage */
    .stage {
      position: relative; z-index: 2;
      width: 1520px;
      text-align: center;
      padding: 0 80px;
    }
    .brand-row {
      display: inline-flex; align-items: center; gap: 22px;
      padding: 16px 36px;
      border-radius: 100px;
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: 0 12px 40px rgba(26,11,46,0.06);
      margin-bottom: 48px;
      opacity: 0; transform: translateY(-20px);
    }
    .brand-row svg { width: 42px; height: 22px; }
    .brand-row .name {
      font-family: var(--font-heading);
      font-weight: 700; font-size: 22px;
      letter-spacing: 0.02em;
      color: var(--text-primary);
    }
    .brand-row .sep {
      width: 1px; height: 20px; background: var(--border);
    }
    .brand-row .sub {
      font-family: var(--font-mono); font-size: 14px;
      color: var(--text-muted);
      letter-spacing: 0.1em; text-transform: uppercase;
    }
    h1 {
      font-family: var(--font-heading);
      font-size: 120px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.035em;
      margin-bottom: 28px;
    }
    .h-static {
      display: block;
      color: var(--text-primary);
      opacity: 0; transform: translateY(28px);
    }
    .h-typed-wrap {
      display: inline-block;
      margin-top: 8px;
      min-height: 140px;
    }
    .h-typed {
      color: var(--accent-lime-dark);
      background: linear-gradient(135deg, var(--accent-lime-dark) 0%, #5fa200 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .cursor {
      display: inline-block;
      width: 6px; height: 90px;
      background: var(--accent-lime);
      margin-left: 8px;
      vertical-align: -20px;
      border-radius: 3px;
      box-shadow: 0 0 12px var(--accent-lime-glow);
      opacity: 0;
    }
    .subtitle {
      font-size: 28px;
      line-height: 1.55;
      color: var(--text-secondary);
      max-width: 1100px;
      margin: 36px auto 0;
      opacity: 0; transform: translateY(20px);
    }
    .subtitle strong { color: var(--text-primary); }
    .status {
      display: inline-flex; align-items: center; gap: 14px;
      margin-top: 56px;
      padding: 14px 30px;
      border-radius: 100px;
      background: #fff;
      border: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 15px;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text-secondary);
      box-shadow: 0 10px 30px rgba(26,11,46,0.06);
      opacity: 0; transform: translateY(20px);
    }
    .dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent-lime);
      box-shadow: 0 0 0 5px var(--accent-lime-soft), 0 0 20px var(--accent-lime-glow);
    }
  </style>
</head>
<body>
  <svg class="bolt-bg" id="boltBg" viewBox="0 14 56 28" xmlns="http://www.w3.org/2000/svg">

  </svg>

  <div class="particles" id="particles"></div>

  <div class="stage">
    <div class="brand-row" id="brandRow">
      <svg viewBox="0 14 56 28" xmlns="http://www.w3.org/2000/svg">
        <path fill="#abfa0f" d="M 2.9872 38.4685 C 3.5717 38.4685 4.1778 38.3170 4.8056 37.9706 L 17.5339 30.6107 L 36.1717 40.5899 C 37.0159 41.0228 37.7736 41.2826 38.4663 41.2826 C 39.4836 41.2826 40.3497 40.8064 41.2585 39.7240 L 55.2641 22.0170 C 55.7619 21.3676 56 20.6965 56 20.0688 C 56 18.5751 54.7662 17.2980 53.0993 17.2980 C 52.5150 17.2980 51.8655 17.4495 51.2161 17.8392 L 38.4663 25.1990 L 19.8284 15.2199 C 18.9842 14.7437 18.2049 14.5272 17.5122 14.5272 C 16.5165 14.5272 15.6289 14.9818 14.7631 16.0858 L .7576 33.7928 C .2165 34.4422 0 35.1133 0 35.7410 C 0 37.2563 1.3421 38.4685 2.9872 38.4685 Z M 4.3077 34.9184 C 4.0479 35.0699 3.8531 34.8318 4.0263 34.6370 L 17.2741 18.4452 C 17.5772 18.0556 17.8802 18.0123 18.2699 18.2288 L 37.6870 28.5976 C 38.5962 29.0738 38.8775 28.9656 39.5919 28.4894 L 51.7574 20.8913 C 51.9520 20.7614 52.1688 20.9779 51.9954 21.1728 L 38.7477 37.3645 C 38.4446 37.7325 38.1416 37.7975 37.7519 37.5810 L 18.3131 27.2122 C 17.4256 26.7360 17.1442 26.8442 16.4083 27.2988 Z"/>
      </svg>
      <span class="name">FAKTOTUM</span>
      <span class="sep"></span>
      <span class="sub">Intelligent Automation</span>
    </div>

    <h1>
      <span class="h-static" id="hStatic">Il tuo prossimo collaboratore</span>
      <span class="h-typed-wrap">
        <span class="h-typed" id="hTyped"></span><span class="cursor" id="cursor"></span>
      </span>
    </h1>

    <p class="subtitle" id="subtitle">
      Agenti autonomi intelligenti per i tuoi flussi di lavoro.<br>
      Recupera fino a <strong>20 ore settimanali</strong> — automatizza il semplice, libera il complesso.
    </p>

    <div class="status" id="status">
      <span class="dot"></span>
      <span>FAKTOTUM SYSTEM ONLINE · Processing automation tasks</span>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    // Particles
    const particlesEl = document.getElementById('particles');
    for (let i = 0; i < 32; i++) {
      const p = document.createElement('div');
      p.className = 'p';
      p.style.left = Math.random() * 100 + '%';
      p.style.top = Math.random() * 100 + '%';
      const s = 6 + Math.random() * 10;
      p.style.width = s + 'px';
      p.style.height = s + 'px';
      particlesEl.appendChild(p);
    }

    const typedText = "non è umano. È più efficiente.";
    const hTyped = document.getElementById('hTyped');

    const tl = gsap.timeline({ defaults: { ease: 'power2.out' } });

    tl
      // 0.0s — bolt bg appears (glow)
      .to('#boltBg', { opacity: 0.08, scale: 1, duration: 1.6, ease: 'power3.out' }, 0)
      // 0.4s — brand pill drops in
      .to('#brandRow', { opacity: 1, y: 0, duration: 0.9, ease: 'back.out(1.4)' }, 0.4)
      // 1.1s — static headline
      .to('#hStatic', { opacity: 1, y: 0, duration: 0.8 }, 1.1)
      // 2.0s — cursor appears
      .to('#cursor', { opacity: 1, duration: 0.2 }, 2.0)
      // Cursor blink continuous (separate timeline)
      .call(() => {
        gsap.to('#cursor', {
          opacity: 0.1,
          duration: 0.5,
          repeat: -1,
          yoyo: true,
          ease: 'steps(1)'
        });
      }, null, 2.0)
      // 2.2s — typewriter effect for typed text (advance char by char)
      .call(() => { hTyped.textContent = ''; }, null, 2.2);

    // Typing timeline additions
    const charDur = 0.055;
    for (let i = 0; i < typedText.length; i++) {
      tl.call(
        () => { hTyped.textContent = typedText.substring(0, i + 1); },
        null,
        2.2 + i * charDur
      );
    }

    const typeEnd = 2.2 + typedText.length * charDur;

    tl
      // Subtitle after typing finishes
      .to('#subtitle', { opacity: 1, y: 0, duration: 0.9 }, typeEnd + 0.25)
      // Status bar
      .to('#status', { opacity: 1, y: 0, duration: 0.8 }, typeEnd + 0.9)
      // Particles start floating around 1.5s and keep going
      .to('.p', {
        opacity: gsap.utils.random(0.25, 0.75, 0.01),
        y: '-=100',
        duration: 6,
        stagger: { each: 0.12, from: 'random' },
        ease: 'sine.inOut'
      }, 1.5)
      // Subtle scale pulse on bolt bg near end
      .to('#boltBg', {
        opacity: 0.14,
        scale: 1.05,
        duration: 2.5,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: 1
      }, typeEnd + 1.5)
      // Hold the final frame
      .to({}, { duration: 0.1 }, 14.5);

    window.__ready = true;
    document.body.classList.add('ready');
  </script>
</body>
</html>
