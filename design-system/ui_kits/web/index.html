<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAKTOTUM — Intelligent Automation</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body { background: #F8F9FA; color: #1A0B2E; font-family: 'Inter', sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #E5E1EB; border-radius: 3px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel">

const AGENTS = [
  { id:1, name:'Invoice Processor',  description:'Extracts data from PDF invoices and logs to spreadsheet', status:'active',  runs:1284, lastRun:'2 min ago' },
  { id:2, name:'Email Classifier',   description:'Categorizes incoming support emails and routes to teams',  status:'active',  runs:8431, lastRun:'just now' },
  { id:3, name:'Lead Enricher',      description:'Pulls CRM data and enriches new leads from web sources',  status:'running', runs:342,  lastRun:'5 min ago' },
  { id:4, name:'Report Generator',   description:'Compiles weekly metrics and sends PDF to stakeholders',   status:'idle',    runs:52,   lastRun:'3 days ago' },
  { id:5, name:'Inventory Sync',     description:'Syncs stock levels between warehouse and Shopify store',  status:'error',   runs:97,   lastRun:'1 hour ago' },
  { id:6, name:'Contract Analyzer',  description:'Reviews contracts for key clauses using AI extraction',   status:'idle',    runs:18,   lastRun:'1 week ago' },
];

// ── Dashboard ─────────────────────────────────────────────────
function DashboardScreen() {
  return (
    <div style={{padding:'32px 36px',overflowY:'auto',height:'100%'}}>
      <div style={{marginBottom:28}}>
        <div style={{fontSize:11,fontWeight:600,letterSpacing:'0.1em',textTransform:'uppercase',color:'#6B5A7D',marginBottom:6}}>Overview</div>
        <h1 style={{fontFamily:'Space Grotesk',fontSize:26,fontWeight:700,letterSpacing:0,color:'#1A0B2E'}}>Dashboard</h1>
      </div>

      <div style={{display:'flex',gap:14,marginBottom:24}}>
        <StatCard label="Active Agents"    value="24"    trend="↑ 3 this week"/>
        <StatCard label="Tasks Automated"  value="1,847" trend="↑ 12% this month"/>
        <StatCard label="Time Saved"       value="138h"  trend="this month" gradient="linear-gradient(135deg,#667EEA,#764BA2)"/>
        <StatCard label="Success Rate"     value="98.4%" trend="↑ 0.6%"/>
      </div>

      <Card style={{marginBottom:20,padding:0}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'16px 20px',borderBottom:'1px solid #F0EBF5'}}>
          <span style={{fontFamily:'Space Grotesk',fontWeight:700,fontSize:15,color:'#1A0B2E'}}>Recent Agents</span>
          <Button variant="subtle" size="sm">View all</Button>
        </div>
        {AGENTS.slice(0,4).map(a=><AgentRow key={a.id} {...a} onRun={()=>{}}/>)}
      </Card>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
        <Card>
          <div style={{fontSize:11,fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase',color:'#6B5A7D',marginBottom:16}}>Automation by type</div>
          {[['Email & Comms','42%',0.42],['Document Processing','31%',0.31],['Data Sync','18%',0.18],['Reporting','9%',0.09]].map(([lbl,pct,w])=>(
            <div key={lbl} style={{marginBottom:12}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}>
                <span style={{fontSize:13,color:'#4A3A5C'}}>{lbl}</span>
                <span style={{fontSize:13,fontWeight:600,color:'#1A0B2E'}}>{pct}</span>
              </div>
              <div style={{height:4,borderRadius:2,background:'#F0EBF5'}}>
                <div style={{height:'100%',borderRadius:2,width:`${w*100}%`,background:'linear-gradient(90deg,#667EEA,#764BA2)'}}/>
              </div>
            </div>
          ))}
        </Card>
        <Card>
          <div style={{fontSize:11,fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase',color:'#6B5A7D',marginBottom:14}}>Quick actions</div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {['Create new agent','Import workflow','View run logs','Invite teammate'].map(a=>(
              <button key={a} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'11px 14px',background:'#F8F9FA',border:'1px solid #E5E1EB',borderRadius:10,cursor:'pointer',color:'#4A3A5C',fontFamily:'Inter',fontSize:13,transition:'all 150ms'}}
                onMouseEnter={e=>{e.currentTarget.style.borderColor='#764BA2';e.currentTarget.style.color='#764BA2';}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor='#E5E1EB';e.currentTarget.style.color='#4A3A5C';}}>
                {a}
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="9 18 15 12 9 6"/></svg>
              </button>
            ))}
          </div>
        </Card>
      </div>
    </div>
  );
}

// ── Agents ────────────────────────────────────────────────────
function AgentsScreen({ onCreate }) {
  const [search, setSearch] = React.useState('');
  const filtered = AGENTS.filter(a=>
    a.name.toLowerCase().includes(search.toLowerCase()) ||
    a.description.toLowerCase().includes(search.toLowerCase())
  );
  return (
    <div style={{padding:'32px 36px',overflowY:'auto',height:'100%'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:24}}>
        <div>
          <div style={{fontSize:11,fontWeight:600,letterSpacing:'0.1em',textTransform:'uppercase',color:'#6B5A7D',marginBottom:6}}>Manage</div>
          <h1 style={{fontFamily:'Space Grotesk',fontSize:26,fontWeight:700,letterSpacing:0,color:'#1A0B2E'}}>Agents</h1>
        </div>
        <Button variant="primary" onClick={onCreate}>+ New Agent</Button>
      </div>
      <div style={{position:'relative',marginBottom:16}}>
        <svg style={{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)',pointerEvents:'none'}} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B5A7D" strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search agents…"
          style={{width:'100%',background:'#fff',border:'1.5px solid #E5E1EB',borderRadius:10,padding:'10px 14px 10px 40px',fontFamily:'Inter',fontSize:14,color:'#1A0B2E',outline:'none'}}/>
      </div>
      <Card style={{padding:0}}>
        {filtered.map(a=><AgentRow key={a.id} {...a} onRun={()=>{}}/>)}
        {!filtered.length&&<div style={{padding:40,textAlign:'center',color:'#6B5A7D',fontSize:14}}>No agents match your search</div>}
      </Card>
    </div>
  );
}

// ── New Agent Modal ───────────────────────────────────────────
function NewAgentModal({ onClose, onSave }) {
  const [name, setName]       = React.useState('');
  const [desc, setDesc]       = React.useState('');
  const [trigger, setTrigger] = React.useState('webhook');
  return (
    <Modal title="Create New Agent" onClose={onClose}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <Input label="Agent Name" placeholder="e.g. Invoice Processor" value={name} onChange={e=>setName(e.target.value)}/>
        <Input label="Description" placeholder="What does this agent do?" value={desc} onChange={e=>setDesc(e.target.value)}/>
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          <label style={{fontSize:12,fontWeight:600,color:'#6B5A7D',letterSpacing:'0.06em',textTransform:'uppercase',fontFamily:'Inter'}}>Trigger</label>
          <div style={{display:'flex',gap:8}}>
            {['webhook','schedule','email'].map(t=>(
              <button key={t} onClick={()=>setTrigger(t)} style={{flex:1,padding:'9px',borderRadius:9,border:`1.5px solid ${trigger===t?'#ABFA0F':'#E5E1EB'}`,background:trigger===t?'#F5FFE0':'#F8F9FA',color:trigger===t?'#4D7600':'#6B5A7D',fontFamily:'Inter',fontWeight:500,fontSize:13,cursor:'pointer',textTransform:'capitalize',transition:'all 150ms'}}>
                {t}
              </button>
            ))}
          </div>
        </div>
        <div style={{display:'flex',gap:10,marginTop:8}}>
          <Button variant="ghost" onClick={onClose} style={{flex:1}}>Cancel</Button>
          <Button variant="primary" onClick={()=>onSave&&onSave({name,desc,trigger})} style={{flex:2}}>Create Agent</Button>
        </div>
      </div>
    </Modal>
  );
}

// ── Workflows ─────────────────────────────────────────────────
function WorkflowsScreen() {
  const wf = [
    {name:'Invoice to Spreadsheet', steps:4, status:'active',  runs:1284},
    {name:'Support Email Router',   steps:6, status:'active',  runs:8431},
    {name:'Weekly Report Bundle',   steps:3, status:'idle',    runs:52},
    {name:'New Lead Pipeline',      steps:8, status:'running', runs:342},
  ];
  return (
    <div style={{padding:'32px 36px',overflowY:'auto',height:'100%'}}>
      <div style={{marginBottom:24}}>
        <div style={{fontSize:11,fontWeight:600,letterSpacing:'0.1em',textTransform:'uppercase',color:'#6B5A7D',marginBottom:6}}>Automate</div>
        <h1 style={{fontFamily:'Space Grotesk',fontSize:26,fontWeight:700,letterSpacing:0,color:'#1A0B2E'}}>Workflows</h1>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:14}}>
        {wf.map(w=>(
          <Card key={w.name} onClick={()=>{}} style={{cursor:'pointer'}}>
            <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:14}}>
              <div style={{width:40,height:40,borderRadius:10,background:'rgba(118,75,162,0.1)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#764BA2" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <rect x="2" y="3" width="6" height="6" rx="1.5"/><rect x="16" y="3" width="6" height="6" rx="1.5"/>
                  <rect x="9" y="15" width="6" height="6" rx="1.5"/>
                  <line x1="5" y1="9" x2="5" y2="12"/><line x1="19" y1="9" x2="19" y2="12"/>
                  <path d="M5 12h14"/><line x1="12" y1="12" x2="12" y2="15"/>
                </svg>
              </div>
              <Badge variant={w.status}>{w.status.charAt(0).toUpperCase()+w.status.slice(1)}</Badge>
            </div>
            <div style={{fontFamily:'Space Grotesk',fontWeight:600,fontSize:16,color:'#1A0B2E',marginBottom:4}}>{w.name}</div>
            <div style={{fontSize:13,color:'#6B5A7D',marginBottom:16}}>{w.steps} steps · {w.runs.toLocaleString()} runs</div>
            <div style={{display:'flex',gap:4}}>
              {Array.from({length:w.steps}).map((_,i)=>(
                <div key={i} style={{flex:1,height:3,borderRadius:2,background:i<Math.ceil(w.steps*0.7)?'linear-gradient(90deg,#667EEA,#764BA2)':'#F0EBF5'}}/>
              ))}
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
}

// ── Analytics ─────────────────────────────────────────────────
function AnalyticsScreen() {
  const months = ['Nov','Dec','Jan','Feb','Mar','Apr'];
  const vals   = [320,580,750,920,1400,1847];
  const max    = Math.max(...vals);
  return (
    <div style={{padding:'32px 36px',overflowY:'auto',height:'100%'}}>
      <div style={{marginBottom:24}}>
        <div style={{fontSize:11,fontWeight:600,letterSpacing:'0.1em',textTransform:'uppercase',color:'#6B5A7D',marginBottom:6}}>Insights</div>
        <h1 style={{fontFamily:'Space Grotesk',fontSize:26,fontWeight:700,letterSpacing:0,color:'#1A0B2E'}}>Analytics</h1>
      </div>
      <Card style={{marginBottom:16}}>
        <div style={{fontSize:11,fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase',color:'#6B5A7D',marginBottom:20}}>Tasks automated over time</div>
        <div style={{display:'flex',alignItems:'flex-end',gap:10,height:130}}>
          {months.map((m,i)=>(
            <div key={m} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:8}}>
              <div style={{width:'100%',borderRadius:'4px 4px 0 0',background:i===months.length-1?'linear-gradient(180deg,#667EEA,#764BA2)':'#F0EBF5',height:`${(vals[i]/max)*110}px`}}/>
              <div style={{fontSize:11,color:'#6B5A7D'}}>{m}</div>
            </div>
          ))}
        </div>
      </Card>
      <div style={{display:'flex',gap:14}}>
        <StatCard label="Avg Daily Runs"   value="612"  trend="↑ 8% vs last month"/>
        <StatCard label="Peak Concurrent"  value="47"   trend="Mar 12"/>
        <StatCard label="Error Rate"       value="1.6%" trend="↓ 0.6% improved"/>
      </div>
    </div>
  );
}

// ── Settings ──────────────────────────────────────────────────
function SettingsScreen() {
  const [emailNotif, setEmailNotif] = React.useState(true);
  const [autoRetry,  setAutoRetry]  = React.useState(true);
  const Toggle = ({value,onChange}) => (
    <div onClick={()=>onChange(!value)} style={{width:42,height:23,borderRadius:12,background:value?'#ABFA0F':'#E5E1EB',cursor:'pointer',position:'relative',transition:'background 150ms',flexShrink:0}}>
      <div style={{width:17,height:17,borderRadius:'50%',background:'#fff',boxShadow:'0 1px 4px rgba(26,11,46,0.2)',position:'absolute',top:3,left:value?22:3,transition:'left 150ms'}}/>
    </div>
  );
  return (
    <div style={{padding:'32px 36px',overflowY:'auto',height:'100%'}}>
      <div style={{marginBottom:24}}>
        <div style={{fontSize:11,fontWeight:600,letterSpacing:'0.1em',textTransform:'uppercase',color:'#6B5A7D',marginBottom:6}}>Preferences</div>
        <h1 style={{fontFamily:'Space Grotesk',fontSize:26,fontWeight:700,letterSpacing:0,color:'#1A0B2E'}}>Settings</h1>
      </div>
      <div style={{maxWidth:500,display:'flex',flexDirection:'column',gap:14}}>
        <Card>
          <div style={{fontSize:14,fontWeight:700,color:'#1A0B2E',fontFamily:'Space Grotesk',marginBottom:16}}>Account</div>
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            <Input label="Name"  value="Alessio Mancini"/>
            <Input label="Email" value="alessio@faktotum.io" type="email"/>
          </div>
        </Card>
        <Card>
          <div style={{fontSize:14,fontWeight:700,color:'#1A0B2E',fontFamily:'Space Grotesk',marginBottom:16}}>Notifications</div>
          {[
            ['Email notifications','Send run summaries to your email',emailNotif,setEmailNotif],
            ['Auto retry on error','Re-run failed agents automatically',autoRetry,setAutoRetry],
          ].map(([title,desc,val,set])=>(
            <div key={title} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 0',borderBottom:'1px solid #F0EBF5'}}>
              <div>
                <div style={{fontSize:14,color:'#1A0B2E',fontFamily:'Inter'}}>{title}</div>
                <div style={{fontSize:12,color:'#6B5A7D',marginTop:2}}>{desc}</div>
              </div>
              <Toggle value={val} onChange={set}/>
            </div>
          ))}
        </Card>
        <Card>
          <div style={{fontSize:14,fontWeight:700,color:'#1A0B2E',fontFamily:'Space Grotesk',marginBottom:4}}>API Key</div>
          <div style={{fontSize:12,color:'#6B5A7D',marginBottom:14}}>Use this key to access the FAKTOTUM API</div>
          <div style={{display:'flex',gap:8}}>
            <div style={{flex:1,background:'#F8F9FA',border:'1px solid #E5E1EB',borderRadius:10,padding:'10px 14px',fontSize:13,fontFamily:'monospace',color:'#6B5A7D',letterSpacing:'0.05em'}}>fkt_live_••••••••••••••••</div>
            <Button variant="subtle" size="sm">Reveal</Button>
          </div>
        </Card>
        <div><Button variant="primary">Save changes</Button></div>
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────
function App() {
  const [screen, setScreen]   = React.useState('Dashboard');
  const [modal,  setModal]    = React.useState(false);
  const screens = {
    Dashboard: <DashboardScreen/>,
    Agents:    <AgentsScreen onCreate={()=>setModal(true)}/>,
    Workflows: <WorkflowsScreen/>,
    Analytics: <AnalyticsScreen/>,
    Settings:  <SettingsScreen/>,
  };
  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <Sidebar active={screen} onNav={setScreen}/>
      <div style={{flex:1,overflowY:'auto',background:'#F8F9FA'}}>
        {screens[screen]}
      </div>
      {modal && <NewAgentModal onClose={()=>setModal(false)} onSave={()=>setModal(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
