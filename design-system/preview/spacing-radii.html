<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #F8F9FA; font-family: 'Inter', sans-serif; padding: 20px; }
  .row { display: flex; gap: 16px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 56px; height: 36px; background: #fff; border: 1px solid #E5E1EB; }
  .label { font-size: 10px; color: #6B5A7D; text-align: center; }
  .val   { font-size: 9px; color: #6B5A7D; font-family: monospace; opacity: 0.6; }
</style>
</head>
<body>
<div class="row">
  <div class="item"><div class="box" style="border-radius:0"></div><div class="label">None</div><div class="val">0</div></div>
  <div class="item"><div class="box" style="border-radius:6px"></div><div class="label">SM</div><div class="val">6px</div></div>
  <div class="item"><div class="box" style="border-radius:12px"></div><div class="label">MD</div><div class="val">12px</div></div>
  <div class="item"><div class="box" style="border-radius:20px"></div><div class="label">LG</div><div class="val">20px</div></div>
  <div class="item"><div class="box" style="border-radius:28px"></div><div class="label">XL</div><div class="val">28px</div></div>
  <div class="item"><div class="box" style="border-radius:999px"></div><div class="label">Full</div><div class="val">pill</div></div>
</div>
</body>
</html>
