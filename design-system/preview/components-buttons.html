<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #F8F9FA; font-family: 'Inter', sans-serif; padding: 24px 20px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 9999px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; border: none; padding: 10px 22px; transition: all 150ms; }
  .primary { background: #ABFA0F; color: #1A0B2E; box-shadow: 0 4px 14px rgba(140,196,8,0.3); }
  .primary:hover { background: #8CC408; }
  .brand   { background: linear-gradient(135deg,#667EEA,#764BA2); color: #fff; }
  .ghost   { background: transparent; color: #1A0B2E; border: 1.5px solid #E5E1EB; }
  .ghost:hover { border-color: #764BA2; color: #764BA2; }
  .subtle  { background: #F8F9FA; color: #4A3A5C; border: 1px solid #E5E1EB; border-radius: 10px; }
  .danger  { background: transparent; color: #E53E3E; border: 1.5px solid rgba(229,62,62,0.3); }
  .sm      { padding: 6px 16px; font-size: 13px; }
</style>
</head>
<body>
<div class="row">
  <button class="btn primary">Get Started</button>
  <button class="btn brand">Automate Now</button>
  <button class="btn ghost">Learn More</button>
  <button class="btn subtle">Settings</button>
  <button class="btn primary sm">Add Agent</button>
  <button class="btn danger sm">Delete</button>
</div>
</body>
</html>
