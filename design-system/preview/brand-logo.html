<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #F8F9FA; font-family: 'Inter', sans-serif; padding: 24px; }
  .grid  { display: flex; flex-direction: column; gap: 16px; }
  .row   { display: flex; gap: 12px; align-items: center; }
  .pad   { padding: 16px 24px; border-radius: 12px; display: flex; align-items: center; }
  .on-white  { background: #fff; border: 1px solid #E5E1EB; }
  .on-soft   { background: #F8F9FA; border: 1px solid #E5E1EB; }
  .on-dark   { background: #1A0B2E; }
  .on-brand  { background: linear-gradient(135deg,#667EEA,#764BA2); }
  .label { font-size: 10px; color: #6B5A7D; letter-spacing: 0.06em; text-transform: uppercase; min-width: 72px; }

  /* Real logo mark path */
  .mark { display: flex; align-items: center; justify-content: center; }
</style>
</head>
