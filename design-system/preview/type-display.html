<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; font-family: 'Space Grotesk', sans-serif; padding: 24px 20px; }
  .row { display: flex; flex-direction: column; gap: 10px; }
  .item { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid #F0EBF5; padding-bottom: 10px; }
  .item:last-child { border-bottom: none; }
  .meta { min-width: 110px; font-size: 10px; color: #6B5A7D; font-family: 'Inter', sans-serif; letter-spacing: 0.06em; text-transform: uppercase; }
  .h1 { font-size: 48px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; color: #1A0B2E; }
  .h2 { font-size: 36px; font-weight: 700; letter-spacing: -0.025em; color: #1A0B2E; }
  .h3 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; color: #1A0B2E; }
  .h4 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; color: #1A0B2E; }
</style>
</head>
<body>
<div class="row">
  <div class="item"><div class="meta">H1 · 48px / 700</div><div class="h1">Intelligent Automation</div></div>
  <div class="item"><div class="meta">H2 · 36px / 700</div><div class="h2">Automate Everything</div></div>
  <div class="item"><div class="meta">H3 · 28px / 600</div><div class="h3">Build your first agent</div></div>
  <div class="item"><div class="meta">H4 · 22px / 700</div><div class="h4">Workflow Overview</div></div>
</div>
</body>
</html>
