<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #F8F9FA; font-family: 'Inter', sans-serif; padding: 20px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch { flex: 1; min-width: 80px; border-radius: 10px; overflow: hidden; border: 1px solid #E5E1EB; }
  .swatch-color { height: 70px; }
  .swatch-info { padding: 8px 10px; background: #fff; }
  .swatch-name { font-size: 11px; font-weight: 500; color: #1A0B2E; }
  .swatch-hex  { font-size: 10px; color: #6B5A7D; margin-top: 2px; font-family: monospace; }
</style>
</head>
<body>
<div class="row">
  <div class="swatch">
    <div class="swatch-color" style="background:#ABFA0F"></div>
    <div class="swatch-info"><div class="swatch-name">Lime</div><div class="swatch-hex">#ABFA0F</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#F5FFE0"></div>
    <div class="swatch-info"><div class="swatch-name">Lime Soft</div><div class="swatch-hex">#F5FFE0</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#8CC408"></div>
    <div class="swatch-info"><div class="swatch-name">Lime Dark</div><div class="swatch-hex">#8CC408</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#667EEA"></div>
    <div class="swatch-info"><div class="swatch-name">Blue</div><div class="swatch-hex">#667EEA</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#764BA2"></div>
    <div class="swatch-info"><div class="swatch-name">Purple</div><div class="swatch-hex">#764BA2</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:rgba(171,250,15,0.30);border:1px solid rgba(171,250,15,0.4)"></div>
    <div class="swatch-info"><div class="swatch-name">Lime Glow</div><div class="swatch-hex">30% lime</div></div>
  </div>
</div>
</body>
</html>
