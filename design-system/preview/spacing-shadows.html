<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #F8F9FA; font-family: 'Inter', sans-serif; padding: 24px 20px; }
  .row { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 80px; height: 44px; background: #fff; border-radius: 10px; border: 1px solid #E5E1EB; }
  .label { font-size: 10px; color: #6B5A7D; text-align: center; letter-spacing: 0.04em; text-transform: uppercase; }
  .sm   { box-shadow: 0 1px 3px rgba(26,11,46,0.08), 0 1px 2px rgba(26,11,46,0.04); }
  .card { box-shadow: 0 4px 16px rgba(26,11,46,0.08), 0 0 0 1px #E5E1EB; }
  .modal{ box-shadow: 0 24px 64px rgba(26,11,46,0.18), 0 0 0 1px #E5E1EB; }
  .lime { box-shadow: 0 0 20px rgba(171,250,15,0.5); border-color: #ABFA0F; }
</style>
</head>
<body>
<div class="row">
  <div class="item"><div class="box sm"></div><div class="label">SM</div></div>
  <div class="item"><div class="box card"></div><div class="label">Card</div></div>
  <div class="item"><div class="box modal"></div><div class="label">Modal</div></div>
  <div class="item"><div class="box lime"></div><div class="label">Lime Glow</div></div>
</div>
</body>
</html>
